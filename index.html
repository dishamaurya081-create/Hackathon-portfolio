const NT={'nagar-ai':['Photos in, decisions out: a citizen reports an issue with GPS and a photo, and Gemini Vision compares the repair photo with the earlier condition before a ticket is closed.','Maps: Leaflet draws the Ward Pulse Map, so complaints and waterlogging risk show up by ward.','Reporting: jsPDF builds the audited municipal report in the browser.','Scope: a React and TypeScript front end deployed on Vercel.'],classmate:['Data: timetables are organised by department, semester, section, track and lab group in Supabase (PostgreSQL), with Auth and row-level security.','Live state: the app compares the current time with each slot’s start and end to find the current lecture, the next lab and the break countdown.','Offline: a service worker caches the timetable so the schedule still opens without signal.','Reminders: Web Push with VAPID keys sends pre-class warnings, 5 minutes before class.']};
NT['nagar-ai'].push('Interface: a language selector and three visual themes (Monsoon, Koli Dawn, Marine Neon), plus filters for waterlogging, potholes, lights and water shortage.');
NT.classmate.push('Navigation: Home Dashboard, Weekly Timetable, Academic Calendar, Admin Calendar and Profile and Settings, with an install prompt for the PWA.');
NT['privacy-guardian']=['Input: paste policy text or drop a PDF or TXT file up to 15 MB, or try one of six preset sample policies.','Two modes: Analyze One Document and Compare Two Documents, both powered by Gemini.','Privacy: the app states that documents are processed on the fly and uploads are not stored.'];
P.forEach(p=>{p.sh=SH[p.id];p.notes=NT[p.id]});

function hero(){const c=$('#cv'),x=c.getContext('2d'),S=48,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H2,cols,rows,ox,oy,ps=[],raf,vis=true;
const hs=(i,j)=>{const n=Math.sin(i*127.1+j*311.7)*43758.5;return n-Math.floor(n)},act=(i,j,d)=>hs(i*3+d,j*5+d*7)<.3;
const pins=[['nagar-ai',.3,.25],['classmate',.8,.2],['privacy-guardian',.55,.55],['pippa',.85,.7],['dodgelife',.35,.85]];
function size(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H2=r.height;c.width=W*d;c.height=H2*d;x.setTransform(d,0,0,d,0,0);cols=Math.floor(W/S);rows=Math.floor(H2/S);ox=(W-(cols-1)*S)/2;oy=(H2-(rows-1)*S)/2;
$$('.pin').forEach(p=>p.remove());pins.forEach(([id,fx,fy])=>{const b=document.createElement('button'),n=P.find(q=>q.id===id);b.className='pin';b.dataset.v='p-'+id;b.setAttribute('aria-label','Open case study: '+n.n);b.style.left=ox+Math.round(fx*(cols-1))*S+'px';b.style.top=oy+Math.round(fy*(rows-1))*S+'px';b.innerHTML='<span>'+n.n+'</span>';$('#cvbox').appendChild(b)});
ps=Array.from({length:16},()=>({i:Math.floor(Math.random()*cols),j:Math.floor(Math.random()*rows),dx:1,dy:0,t:Math.random()}));draw()}
function draw(){const dk=document.documentElement.dataset.theme==='dark',k=dk?'237,231,218':'11,27,51',tl=dk?'95,209,204':'8,107,107';x.clearRect(0,0,W,H2);x.lineWidth=1;x.strokeStyle=`rgba(${k},.09)`;x.beginPath();for(let i=0;i<cols;i++){x.moveTo(ox+i*S,0);x.lineTo(ox+i*S,H2)}for(let j=0;j<rows;j++){x.moveTo(0,oy+j*S);x.lineTo(W,oy+j*S)}x.stroke();
x.lineWidth=2;x.strokeStyle=`rgba(${tl},.5)`;x.beginPath();for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){if(i<cols-1&&act(i,j,0)){x.moveTo(ox+i*S,oy+j*S);x.lineTo(ox+(i+1)*S,oy+j*S)}if(j<rows-1&&act(i,j,1)){x.moveTo(ox+i*S,oy+j*S);x.lineTo(ox+i*S,oy+(j+1)*S)}}x.stroke();
x.fillStyle=`rgba(${k},.55)`;for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)if(hs(i,j)<.22){x.beginPath();x.arc(ox+i*S,oy+j*S,3,0,7);x.fill()}
if(!rm){x.fillStyle='#E0A030';ps.forEach(p=>{const px=ox+(p.i+p.dx*p.t)*S,py=oy+(p.j+p.dy*p.t)*S;x.beginPath();x.arc(px,py,3.5,0,7);x.fill()})}}
function step(){if(vis&&!document.hidden){ps.forEach(p=>{p.t+=.02;if(p.t>=1){p.i+=p.dx;p.j+=p.dy;p.t=0;const d=[[1,0],[-1,0],[0,1],[0,-1]].filter(v=>!(v[0]===-p.dx&&v[1]===-p.dy)&&p.i+v[0]>=0&&p.i+v[0]<cols&&p.j+v[1]>=0&&p.j+v[1]<rows),n=d[Math.floor(Math.random()*d.length)]||[1,0];p.dx=n[0];p.dy=n[1]}});draw()}raf=requestAnimationFrame(step)}
size();const ro=new ResizeObserver(size);ro.observe(c);const io=new IntersectionObserver(e=>vis=e[0].isIntersecting);io.observe(c);if(!rm)raf=requestAnimationFrame(step);stop=()=>{cancelAnimationFrame(raf);ro.disconnect();io.disconnect()}}
